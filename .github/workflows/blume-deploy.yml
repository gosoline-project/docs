name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate content
        run: bun run validate

      - name: Check configuration types
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Checkout existing previews
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .pages

      - name: Preserve PR previews
        run: |
          for preview in .pages/pr-*; do
            if [ -d "$preview" ]; then
              cp -R "$preview" dist/
            fi
          done

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          exclude_assets: '.nojekyll'

permissions:
  contents: write
